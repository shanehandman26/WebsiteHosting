<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Rush — Jet Ski</title>
    <link rel="stylesheet" href="style.css?v=latency-42">
    <style>
        body.home-screen { display: grid; place-items: center; min-height: 100vh; min-height: 100svh; padding: 24px; background: radial-gradient(ellipse at 50% 35%, #380e50 0%, #260d40 50%, #120c2b 100%); }
        .home-screen main { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
        .home-logo {
            display: block;
            width: min(100%, 760px, 94svh);
            height: auto;
            margin-bottom: 16px;
            -webkit-mask-image: linear-gradient(to right, transparent, #000 9%, #000 91%, transparent), linear-gradient(to bottom, transparent, #000 6%, #000 94%, transparent);
            mask-image: linear-gradient(to right, transparent, #000 9%, #000 91%, transparent), linear-gradient(to bottom, transparent, #000 6%, #000 94%, transparent);
            -webkit-mask-composite: source-in;
            mask-composite: intersect;
        }
        .home-screen button { padding: 16px 32px; font-size: 20px; }
    </style>
    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "zcpjnlldtq");
</script>
</head>
<body class="home-screen">
    <main>
        <img class="home-logo" src="assets/ocean-rush-logo.png?v=2" alt="Ocean Rush logo featuring a neon jet ski rider and wave">
        <div class="username-field">
            <label for="username">USERNAME</label>
            <input id="username" type="text" maxlength="16" placeholder="WaveRider" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="usernameHelp" data-clarity-mask="true">
            <small id="usernameHelp">Choose a made-up rider name. Up to 16 letters, numbers, spaces, - or _.</small>
        </div>
        <form action="game.html">
            <button type="submit">Singleplayer</button>
        </form>
        <form action="multiplayer.html">
            <button type="submit">Multiplayer</button>
        </form>
    </main>
    <script src="scripts/profile.js?v=latency-42"></script>
    <script src="scripts/home.js?v=latency-42"></script>
</body>
</html>
