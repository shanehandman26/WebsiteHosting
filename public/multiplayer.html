<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer — Ocean Rush</title>
    <link rel="stylesheet" href="style.css?v=room-codes-33">
</head>
<body class="lobby-screen">
    <main class="multiplayer-lobby">
        <p class="eyebrow">OCEAN RUSH</p>
        <h1>MULTI<span>PLAYER</span></h1>
        <p>Host a room or join your friends with their four-letter code.</p>
        <div class="lobby-options">
            <form action="game.html" method="get" class="lobby-card">
                <h2>Host a room</h2>
                <p>Create a room and share the code shown at the bottom of your game.</p>
                <input type="hidden" name="action" value="host">
                <button type="submit">Host Room</button>
            </form>
            <form action="game.html" method="get" class="lobby-card">
                <h2>Join a room</h2>
                <label for="joinCode">Four-letter room code</label>
                <input id="joinCode" name="room" placeholder="ABCD" minlength="4" maxlength="4" pattern="[A-Za-z]{4}" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
                <button type="submit">Join Room</button>
            </form>
        </div>
        <a href="index.html">Back to home</a>
    </main>
    <script src="scripts/lobby.js?v=room-codes-33"></script>
</body>
</html>
